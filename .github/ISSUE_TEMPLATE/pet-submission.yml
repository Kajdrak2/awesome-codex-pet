name: Submit your pet
description: Ask maintainers to review a pet you created with AI or supplied as existing files
title: "[Submission]: "
labels:
  - "type: submission"
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        <!-- pet-flow: submission -->
        Use this form when a pet already has a spritesheet or final package but a pull request cannot be opened yet. The recommended path is **Submit a pet with Codex** on [codexpet.top](https://codexpet.top), or copy the provided prompt for another AI assistant. The workflow validates the files and opens a focused pull request through the GitHub API without a full clone.
  - type: input
    id: folder_slug
    attributes:
      label: Suggested folder slug
      description: Use pet-slug--author-slug so same-character variants can coexist.
      placeholder: mikoto--lingxiaotian
    validations:
      required: true
  - type: input
    id: pet_name
    attributes:
      label: Default pet name
      description: Choose the canonical fallback name shown when no matching localized name is available.
      placeholder: Mikoto
    validations:
      required: true
  - type: dropdown
    id: bilingual_names
    attributes:
      label: Name language support
      description: Choose whether this pet uses only the default name or supplies both English and Chinese names.
      options:
        - Single-language default name
        - Bilingual English and Chinese names
    validations:
      required: true
  - type: input
    id: pet_name_en
    attributes:
      label: English name
      description: Required only when bilingual naming is selected.
      placeholder: Mikoto
  - type: input
    id: pet_name_zh
    attributes:
      label: Chinese name
      description: Required only when bilingual naming is selected.
      placeholder: 御坂美琴
  - type: dropdown
    id: primary_category
    attributes:
      label: Primary category
      options:
        - Game Characters
        - Anime Characters
        - Original Characters
        - Mascots
        - Animals
        - Fantasy Creatures
        - Robots
        - Human Avatars
        - Memes
        - Objects & Props
        - Others
    validations:
      required: true
  - type: dropdown
    id: pet_version
    attributes:
      label: Pet runtime version
      description: v1 uses a 1536x1872 8x9 atlas. v2 uses a 1536x2288 8x11 atlas and requires spriteVersionNumber 2.
      options:
        - v2 - standard animations plus 16 look directions
        - v1 - legacy standard animations
    validations:
      required: true
  - type: input
    id: collections
    attributes:
      label: Collection slugs
      description: Optional comma-separated franchise or theme slugs from collections.json, such as genshin-impact or animal-companions.
      placeholder: genshin-impact
  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - original
        - fan-art
        - mascot
        - meme
        - avatar
        - object
  - type: input
    id: author
    attributes:
      label: Author or handle
      placeholder: your-name
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL
      placeholder: https://example.com/original-post
  - type: input
    id: canonical_key
    attributes:
      label: Canonical character or concept key
      description: Use a stable key such as genshin-impact/nahida; for an original use original/author/name. This is used to prevent duplicate collection.
      placeholder: original/your-handle/your-character
    validations:
      required: true
  - type: textarea
    id: variant_note
    attributes:
      label: Variant or uniqueness note
      description: Explain the material design or runtime difference if a similar character, mascot, or avatar already exists.
      placeholder: This is a materially different design with a distinct v2 directional atlas.
  - type: textarea
    id: description
    attributes:
      label: Short description
      placeholder: A chibi electric schoolgirl Codex pet inspired by Misaka Mikoto.
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: Asset license or non-commercial use statement
      description: A formal license is optional. If none applies, state clearly that the asset is for non-commercial use only and that you have the right to submit it.
      placeholder: "CC BY-NC 4.0, or: Non-commercial use only; I confirm I have the right to submit this asset."
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Available assets or attachment links
      description: List the finished files available to the AI workflow or reviewers. You may drag a compact submission ZIP into this field when GitHub accepts the attachment. Never attach Hatch Pet run directories, QA media, prompts, or unrelated references.
      placeholder: submission.json, pet.json, spritesheet.webp, or an attachment link
    validations:
      required: true
